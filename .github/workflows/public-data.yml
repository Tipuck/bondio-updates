name: Public data mirror
on:
  workflow_dispatch:
    inputs:
      calendars:
        type: boolean
        default: true
  schedule:
    - cron: '*/30 * * * *'
    - cron: '15 0 * * *'
permissions:
  contents: write
concurrency:
  group: public-data
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve original public snapshots
        env:
          CALENDARS: ${{ inputs.calendars || (github.event_name == 'schedule' && github.event.schedule == '15 0 * * *') }}
        run: |
          if [ "$CALENDARS" = "true" ]; then python scripts/refresh_public.py --calendars; else python scripts/refresh_public.py; fi
      - name: Publish market snapshots first
        run: |
          git config user.name "Bondio public data"
          git config user.email "actions@users.noreply.github.com"
          git add data/bonds.json data/calendars
          if ! git diff --cached --quiet; then git commit -m "Refresh public market snapshots"; git pull --rebase origin main; git push; fi
      - name: Collect shared advisor evidence
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/build_advisor_sources.py --mirror-root .
      - name: Publish shared advisor snapshots
        run: |
          git add data/advisor-core.json data/advisor-calendars.json
          if ! git diff --cached --quiet; then git commit -m "Refresh public advisor snapshots"; git pull --rebase origin main; git push; fi
